name: Public protocol and agent primitives
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: go run ./tools/checkspec
      - run: go vet ./tools/checkspec ./tools/checkdeps
      - run: go test -race ./tools/checkspec
      - shell: pwsh
        run: ./tools/regenerate-vectors.ps1
  production:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - shell: pwsh
        run: |
          $files = Get-ChildItem internal,protocol-go,tools -Recurse -Filter '*.go'
          $bad = & gofmt -l $files.FullName
          if ($bad) { throw "Unformatted Go files: $bad" }
      - run: go mod download
      - run: go mod download
        working-directory: protocol-go
        env:
          GOWORK: 'off'
      - run: go vet ./...
      - run: go vet ./...
        working-directory: protocol-go
        env:
          GOWORK: 'off'
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: protocol-go
        env:
          GOWORK: 'off'
      - shell: pwsh
        run: |
          $env:GOWORK = 'off'
          Push-Location protocol-go
          try { go run ../tools/checkdeps/main.go; if ($LASTEXITCODE -ne 0) { throw 'Dependency boundary failed' } }
          finally { Pop-Location }
  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/connect-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      # Both the package lock and independent native-browser parity are required.
      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
        env:
          CONNECT_TEST_BROWSER: google-chrome
  publication-gate:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [spec, production, typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: pwsh
        run: ./tools/publication-gate.ps1
